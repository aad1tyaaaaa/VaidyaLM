# Airflow + MLflow for local dev. Start: docker compose up -d
#   Airflow UI -> http://localhost:8080  (user: admin, password: see logs, below)
#   MLflow UI  -> http://localhost:5000
# ponytail: single "airflow standalone" container (scheduler+webserver in one) instead of the official
# 8-service compose. LocalExecutor still runs mapped tasks in parallel. Switch to the official file if you need Celery workers.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow:
    build: .
    image: vaidyalm-airflow
    command: standalone
    user: "${AIRFLOW_UID:-50000}:0"
    working_dir: /opt/airflow/repo
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/repo/dags
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PYTHONPATH: /opt/airflow/repo
      HF_HOME: /opt/airflow/repo/data/hf_cache
    volumes:
      - .:/opt/airflow/repo
    ports:
      - "8080:8080"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    volumes:
      - ./mlflow:/mlflow
    ports:
      - "5000:5000"

volumes:
  pgdata:
