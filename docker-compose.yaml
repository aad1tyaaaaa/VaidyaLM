# Airflow + MLflow for local dev. Start: docker compose up -d
#   Airflow UI -> http://localhost:8080  (user: admin, password: see logs, below)
#   MLflow UI  -> http://localhost:5000
# ponytail: single "airflow standalone" container (scheduler+webserver in one) instead of the official
# 8-service compose. LocalExecutor still runs mapped tasks in parallel. Switch to the official file if you need Celery workers.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow:
    image: apache/airflow:2.10.5-python3.11
    command: standalone
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PYTHONPATH: /opt/airflow/repo
      _PIP_ADDITIONAL_REQUIREMENTS: "datasketch lxml beautifulsoup4 pyarrow mlflow==2.17.2"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/repo/src
      - ./data:/opt/airflow/repo/data
      - ./results:/opt/airflow/repo/results
    ports:
      - "8080:8080"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    volumes:
      - ./mlflow:/mlflow
    ports:
      - "5000:5000"

volumes:
  pgdata:
